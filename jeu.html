<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Découvrez l'univers et le gameplay d'Asteroide.Destroyer."
    >

    <title>Le jeu — ASTÉROÏD destroyer</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="css/music-player.css"
    >

</head>


<body>

    <!-- NAVIGATION -->

    <header id="header">

        <nav class="navbar">

            <a
                href="index.html"
                class="logo"
            >
                ASTÉROÏD destroyer
            </a>


            <button
                class="menu-toggle"
                type="button"
                aria-label="Ouvrir le menu"
                aria-expanded="false"
                aria-controls="main-menu"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>


            <div
                class="nav-menu"
                id="main-menu"
            >

                <a
                    href="index.html"
                    class="nav-link"
                >
                    Accueil
                </a>

                <a
                    href="jeu.html"
                    class="nav-link"
                >
                    Le jeu
                </a>

                <a
                    href="medias.html"
                    class="nav-link"
                >
                    Médias
                </a>

                <a
                    href="demo.html"
                    class="nav-link"
                >
                    Démo
                </a>

            </div>

        </nav>

    </header>


    <!-- CONTENU -->

    <main>

        <section id="game-page">

            <div class="section-content">

                <p class="section-label">
                    SYSTEM
                </p>

                <h1>
                    Le jeu
                </h1>

                <p>
                    Découvrez l'univers,
                    le gameplay et le système
                    de défense planétaire
                    d'ASTÉROÏD destroyer.
                </p>

            </div>

        </section>

    </main>

    <!-- =====================================================
     MINI LECTEUR MUSIQUE
     ===================================================== -->

    <div
        class="mini-music-player"
        data-mini-music-player
    >

        <button
            type="button"
            class="mini-music-button"
            data-mini-music-play
            aria-label="Lire la musique"
        >
            ▶
        </button>

        <div class="mini-music-info">

            <span
                class="mini-music-label"
            >
                MUSIC
            </span>

            <span
                class="mini-music-title"
                data-mini-music-title
            >
                A vos postes
            </span>

        </div>

        <input
            type="range"
            class="mini-music-progress"
            data-mini-music-progress
            min="0"
            max="100"
            value="0"
            step="0.1"
            aria-label="Progression de la musique"
        >

        <button
            type="button"
            class="mini-music-button"
            data-mini-music-next
            aria-label="Musique suivante"
        >
            ▶
        </button>

    </div>

    
    <!-- FOOTER -->

    <footer id="footer">

        <p>
            © 2026.ASTÉROÏD-destroyer.AC-TekProd.
        </p>

    </footer>


    <script
        type="module"
        src="js/main.js"
    ></script>

</body>

</html>
